# Pre-commit hooks for whoop-mcp.
#
# Install once:   .venv/bin/pre-commit install
# Run manually:   .venv/bin/pre-commit run --all-files
#
# Hooks run on staged files only by default. pytest is intentionally NOT a
# pre-commit hook — too slow, and CI runs the full suite. Linting is fast
# enough to enforce at commit time.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - httpx>=0.25.0
          - pydantic>=2.0.0
          - cryptography>=41.0.0
        # mypy on src/ only; tests/ is looser (see pyproject.toml overrides).
