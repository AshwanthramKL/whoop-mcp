name: Publish

# Tag push -> PyPI (via trusted publishing OIDC) -> MCP Registry
# (via mcp-publisher OIDC). The registry job needs the PyPI job
# because the registry's ownership check reads the PyPI README;
# if the version isn't live yet, mcp-publisher returns 400.
#
# Both jobs use GitHub OIDC. No PATs, no PyPI token in env, no
# secrets beyond what GitHub provides automatically.

on:
  push:
    tags: ["v*"]

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/whoop-mcp/
    permissions:
      id-token: write  # PyPI trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Validate distributions
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Defaults: uploads everything in dist/, fails on existing files
        # (good — never silently skip a version mismatch).

  publish-registry:
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      id-token: write  # MCP Registry OIDC auth
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Wait for PyPI propagation
        # PyPI's CDN can lag the upload by 30-60s. Poll until the
        # version is visible before letting mcp-publisher's
        # ownership-marker check fire (it reads the live README).
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/whoop-mcp/${VERSION}/json")
            if [ "$CODE" = "200" ]; then
              echo "PyPI ${VERSION} live after poll ${i}"
              exit 0
            fi
            echo "poll ${i}: HTTP ${CODE}, waiting 5s"
            sleep 5
          done
          echo "PyPI did not propagate ${VERSION} within 2 minutes"
          exit 1

      - name: Sync server.json version to tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
             server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
