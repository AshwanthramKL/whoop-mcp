name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Type check (mypy)
        run: mypy src/

      - name: Run tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distribution
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Single "everything passed" check to reference in branch-protection rules.
  # Matrix jobs report one status per cell, which makes required-check lists
  # brittle (change the matrix, the rule breaks). Depending on this aggregator
  # instead keeps the rule config stable across matrix changes.
  ci-pass:
    if: always()
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Fail if any required job didn't succeed
        run: |
          echo "test:  ${{ needs.test.result }}"
          echo "build: ${{ needs.build.result }}"
          if [ "${{ needs.test.result }}" != "success" ] \
          || [ "${{ needs.build.result }}" != "success" ]; then
            exit 1
          fi
